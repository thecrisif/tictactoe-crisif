<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Online</title>

<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at 30% 30%, #0a0f2a, #050814 70%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:flex-start; /* CAMBIO AQUÍ */
  min-height:100vh;
  padding-top:40px; /* espacio arriba */
}

/* efecto partículas suaves */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%, #00f0ff, transparent),
    radial-gradient(2px 2px at 80% 70%, #ff00c8, transparent),
    radial-gradient(2px 2px at 40% 80%, #00ff88, transparent);
  opacity:0.25;
  pointer-events:none;
}

.container{
  width:370px;
  text-align:center;
}

/* TÍTULO NEÓN */
h2{
  font-size:26px;
  letter-spacing:4px;
  background:linear-gradient(90deg,#00f0ff,#ff00c8,#00ff88);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:glowTitle 4s linear infinite;
}

@keyframes glowTitle{
  0%{filter:drop-shadow(0 0 6px #00f0ff);}
  50%{filter:drop-shadow(0 0 18px #ff00c8);}
  100%{filter:drop-shadow(0 0 6px #00ff88);}
}

/* BOTONES */
button{
  padding:12px 18px;
  margin:8px;
  border-radius:12px;
  border:1px solid #00f0ff55;
  background:#0b132f;
  color:#00f0ff;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  transition:.3s ease;
  box-shadow:0 0 10px #00f0ff33;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px #00f0ff;
  background:#111c44;
}

/* INPUT */
input{
  padding:10px;
  text-align:center;
  width:140px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #ff00c855;
  background:#0b132f;
  color:#ff00c8;
  box-shadow:0 0 10px #ff00c855;
  text-transform:uppercase;
}

/* TABLERO */
.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
  padding:12px;
  border-radius:25px;
  position:relative;
  background:#070d25;
  z-index:1;
}

/* MARCO ARCOIRIS ANIMADO */
.board::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:30px;
  background:linear-gradient(
    45deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
  );
  background-size:400%;
  animation:rainbowMove 6s linear infinite;
  z-index:-1;
  filter:blur(8px);
}

@keyframes rainbowMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* CELDAS */
.cell{
  background:#070d25;
  height:95px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:44px;
  cursor:pointer;
  border-radius:14px;
  transition:.2s ease;
}

.cell:hover{
  background:#111c44;
  box-shadow:0 0 20px #ff00c8;
  transform:scale(1.05);
}

/* ESTADO */
.status{
  margin-top:15px;
  padding:10px;
  border-radius:12px;
  border:1px solid #00ff8855;
  box-shadow:0 0 12px #00ff8855;
  font-weight:bold;
  letter-spacing:2px;
}

/* animación cuando aparece X u O */
.cell:empty{
  animation:none;
}

.cell:not(:empty){
  animation:pop .2s ease;
}

@keyframes pop{
  from{transform:scale(0.6);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.hidden{
  display:none;
}
/* TITULO PRINCIPAL */
.tituloJuego{
  margin-bottom:30px;
}

.tituloJuego h1{
  font-size:38px;
  letter-spacing:6px;
  margin:0;
  font-weight:bold;
  background:linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
  );
  background-size:400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rainbowText 6s linear infinite;
  text-shadow:0 0 20px rgba(255,255,255,0.3);
}
</style>
</head>
<body>

<div class="container">
<div class="tituloJuego">
  <h1>TIC TAC TOE</h1>
  <h3 class="autor">THE CRIS IF</h3>
</div>
<div id="menu">
  <h2>TIC TAC TOE ONLINE</h2>
  <button onclick="crearSala()">Crear Sala</button>
  <br>
  <input id="codigoInput" maxlength="4" placeholder="XXXX">
  <br>
  <button onclick="unirseSala()">Unirse</button>
</div>

<div id="esperando" class="hidden">
  <h3>Código:</h3>
  <h2 id="codigoSala"></h2>
  <p>Esperando jugador...</p>
</div>

<div id="game" class="hidden">
  <h3 id="miRol"></h3>
  <div class="board" id="board"></div>
  <div class="status" id="status"></div>
  <button onclick="reiniciar()">Revancha</button>
  <button onclick="salir()">Salir</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyACr8sCnegUV0aqO6Ubrol7KMoq1wcJ_Pg",
  authDomain: "ludo-thecrisif.firebaseapp.com",
  databaseURL: "https://ludo-thecrisif-default-rtdb.firebaseio.com",
  projectId: "ludo-thecrisif",
  storageBucket: "ludo-thecrisif.firebasestorage.app",
  messagingSenderId: "643959425506",
  appId: "1:643959425506:web:c0515d6e4d007ce611d1bb",
  measurementId: "G-1LZ8Y2ML4J"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let sala = null;
let miSimbolo = null;
let turno = "X";

const menu = document.getElementById("menu");
const esperando = document.getElementById("esperando");
const game = document.getElementById("game");
const boardDiv = document.getElementById("board");
const statusDiv = document.getElementById("status");

function generarCodigo(){
  return Math.random().toString(36).substring(2,6).toUpperCase();
}

window.crearSala = async function(){
  sala = generarCodigo();
  miSimbolo = "X";

  await set(ref(db,"salas/"+sala),{
    tablero:Array(9).fill(""),
    turno:"X",
    jugadores:1
  });

  document.getElementById("codigoSala").innerText = sala;
  menu.classList.add("hidden");
  esperando.classList.remove("hidden");

  onValue(ref(db,"salas/"+sala+"/jugadores"),snap=>{
    if(snap.val()===2){
      iniciarJuego();
    }
  });
}

window.unirseSala = async function(){
  sala = document.getElementById("codigoInput").value.toUpperCase();
  if(!sala)return;

  const snapshot = await get(ref(db,"salas/"+sala));
  if(!snapshot.exists()){
    alert("Sala no existe");
    return;
  }

  miSimbolo="O";
  await update(ref(db,"salas/"+sala),{jugadores:2});
  iniciarJuego();
}

function iniciarJuego(){

document.querySelector(".tituloJuego").style.display="none";
  esperando.classList.add("hidden");
  menu.classList.add("hidden");
  game.classList.remove("hidden");

  document.getElementById("miRol").innerText="Eres: "+miSimbolo;
  crearTablero();

  onValue(ref(db,"salas/"+sala),snap=>{
    const data=snap.val();
    if(!data)return;

    turno=data.turno;
    actualizarTablero(data.tablero);
    verificarGanador(data.tablero);
  });
}

function crearTablero(){
  boardDiv.innerHTML="";
  for(let i=0;i<9;i++){
    const cell=document.createElement("div");
    cell.className="cell";
    cell.onclick=()=>hacerMovimiento(i);
    boardDiv.appendChild(cell);
  }
}

function actualizarTablero(tablero){
  const cells=document.querySelectorAll(".cell");
  tablero.forEach((val,i)=>{
    cells[i].innerText=val;
  });

  statusDiv.innerText= turno===miSimbolo ? "Tu turno" : "Turno del rival";
}

async function hacerMovimiento(i){
  const snapshot=await get(ref(db,"salas/"+sala));
  const data=snapshot.val();

  if(data.tablero[i]!=="" || data.turno!==miSimbolo)return;

  data.tablero[i]=miSimbolo;
  data.turno= miSimbolo==="X"?"O":"X";

  await update(ref(db,"salas/"+sala),{
    tablero:data.tablero,
    turno:data.turno
  });
}

function verificarGanador(tablero){
  const combos=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  for(let c of combos){
    const [a,b,c2]=c;
    if(tablero[a] && tablero[a]===tablero[b] && tablero[a]===tablero[c2]){
      statusDiv.innerText= tablero[a]===miSimbolo ? "Ganaste 🎉" : "Perdiste 😢";
      return;
    }
  }

  if(!tablero.includes("")){
    statusDiv.innerText="Empate 🤝";
  }
}

window.reiniciar = async function(){
  await update(ref(db,"salas/"+sala),{
    tablero:Array(9).fill(""),
    turno:"X"
  });
}

window.salir = async function(){
  await remove(ref(db,"salas/"+sala));
  location.reload();
}

</script>
</body>
</html>
