<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Online PRO</title>

<style>

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at 20% 20%, #0a0f2a, #050814 70%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* Fondo partículas */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%, #00d4ff, transparent),
    radial-gradient(2px 2px at 70% 80%, #ff3a00, transparent),
    radial-gradient(2px 2px at 40% 60%, #8800ff, transparent);
  opacity:0.25;
  pointer-events:none;
}

.container{
  width:360px;
  text-align:center;
}

/* TITULO NEON */
h2{
  font-size:28px;
  letter-spacing:4px;
  background:linear-gradient(90deg,#00d4ff,#8800ff,#ff3a00,#ffd700);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:glowText 4s linear infinite;
}

@keyframes glowText{
  0%{filter:drop-shadow(0 0 5px #00d4ff);}
  50%{filter:drop-shadow(0 0 15px #8800ff);}
  100%{filter:drop-shadow(0 0 5px #ff3a00);}
}

/* BOTONES NEON */
button{
  padding:12px 18px;
  margin:8px;
  border-radius:12px;
  border:1px solid #00d4ff55;
  background:#0b132f;
  color:#00d4ff;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  transition:all .3s ease;
  box-shadow:0 0 10px #00d4ff33;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px #00d4ff;
  background:#111c44;
}

/* INPUT */
input{
  padding:10px;
  text-align:center;
  width:140px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #ff3a0055;
  background:#0b132f;
  color:#ff3a00;
  box-shadow:0 0 10px #ff3a0033;
}

/* TABLERO */
.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
  padding:10px;
  border-radius:20px;
  border:2px solid #ff3a00;
  box-shadow:0 0 30px #ff3a00aa;
}

.cell{
  background:#070d25;
  height:95px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  cursor:pointer;
  border-radius:12px;
  transition:.2s;
}

.cell:hover{
  background:#111c44;
  box-shadow:0 0 15px #8800ff;
}

.status{
  margin-top:15px;
  padding:8px;
  border-radius:10px;
  border:1px solid #ff3a0055;
  box-shadow:0 0 10px #ff3a0055;
  letter-spacing:2px;
}

.hidden{display:none;}

</style>
</head>
<body>

<div class="container">

<div id="menu">
  <h2>TIC TAC TOE ONLINE</h2>
  <button onclick="crearSala()">Crear Sala</button>
  <br>
  <input id="codigoInput" maxlength="4" placeholder="XXXX">
  <br>
  <button onclick="unirseSala()">Unirse</button>
</div>

<div id="esperando" class="hidden">
  <h3>Código:</h3>
  <h2 id="codigoSala"></h2>
  <p>Esperando jugador...</p>
</div>

<div id="game" class="hidden">
  <h3 id="miRol"></h3>
  <div class="board" id="board"></div>
  <div class="status" id="status"></div>
  <button onclick="reiniciar()">Revancha</button>
  <button onclick="salir()">Salir</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  get,
  update,
  onValue,
  remove,
  runTransaction,
  onDisconnect,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyACr8sCnegUV0aqO6Ubrol7KMoq1wcJ_Pg",
  authDomain: "ludo-thecrisif.firebaseapp.com",
  databaseURL: "https://ludo-thecrisif-default-rtdb.firebaseio.com",
  projectId: "ludo-thecrisif",
  storageBucket: "ludo-thecrisif.firebasestorage.app",
  messagingSenderId: "643959425506",
  appId: "1:643959425506:web:c0515d6e4d007ce611d1bb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let sala = null;
let miSimbolo = null;
let turno = "X";
let jugadorID = crypto.randomUUID();

const menu = document.getElementById("menu");
const esperando = document.getElementById("esperando");
const game = document.getElementById("game");
const boardDiv = document.getElementById("board");
const statusDiv = document.getElementById("status");

function generarCodigo(){
  return Math.random().toString(36).substring(2,6).toUpperCase();
}

window.crearSala = async function(){
  sala = generarCodigo();
  miSimbolo = "X";

  await set(ref(db,"salas/"+sala),{
    tablero:Array(9).fill(""),
    turno:"X",
    jugadores:{ X: jugadorID },
    creada: serverTimestamp()
  });

  onDisconnect(ref(db,"salas/"+sala)).remove();

  document.getElementById("codigoSala").innerText = sala;
  menu.classList.add("hidden");
  esperando.classList.remove("hidden");

  escucharSala();
}

window.unirseSala = async function(){
  sala = document.getElementById("codigoInput").value.toUpperCase();
  if(!sala)return;

  const snapshot = await get(ref(db,"salas/"+sala));
  if(!snapshot.exists()){
    alert("Sala no existe");
    return;
  }

  miSimbolo = "O";

  await update(ref(db,"salas/"+sala+"/jugadores"),{
    O: jugadorID
  });

  escucharSala();
}

function escucharSala(){
  esperando.classList.add("hidden");
  menu.classList.add("hidden");
  game.classList.remove("hidden");

  document.getElementById("miRol").innerText = "Eres: " + miSimbolo;
  crearTablero();

  onValue(ref(db,"salas/"+sala), snap => {
    const data = snap.val();

    if(!data){
      alert("Sala cerrada");
      location.reload();
      return;
    }

    turno = data.turno;
    actualizarTablero(data.tablero);
    verificarGanador(data.tablero);
  });
}

function crearTablero(){
  boardDiv.innerHTML="";
  for(let i=0;i<9;i++){
    const cell=document.createElement("div");
    cell.className="cell";
    cell.onclick=()=>hacerMovimiento(i);
    boardDiv.appendChild(cell);
  }
}

function actualizarTablero(tablero){
  const cells=document.querySelectorAll(".cell");
  tablero.forEach((val,i)=>{
    cells[i].innerText=val;
  });

  statusDiv.innerText = turno===miSimbolo ? "Tu turno" : "Turno rival";
}

async function hacerMovimiento(i){
  await runTransaction(ref(db,"salas/"+sala), (data)=>{
    if(!data) return;

    if(data.tablero[i]!=="" || data.turno!==miSimbolo){
      return;
    }

    data.tablero[i]=miSimbolo;
    data.turno = miSimbolo==="X"?"O":"X";
    return data;
  });
}

function verificarGanador(tablero){
  const combos=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  for(let c of combos){
    const [a,b,c2]=c;
    if(tablero[a] && tablero[a]===tablero[b] && tablero[a]===tablero[c2]){
      statusDiv.innerText = tablero[a]===miSimbolo ? "Ganaste 🎉" : "Perdiste 😢";
      return;
    }
  }

  if(!tablero.includes("")){
    statusDiv.innerText="Empate 🤝";
  }
}

window.reiniciar = async function(){
  await update(ref(db,"salas/"+sala),{
    tablero:Array(9).fill(""),
    turno:"X"
  });
}

window.salir = async function(){
  await remove(ref(db,"salas/"+sala));
  location.reload();
}

</script>
</body>
</html>
